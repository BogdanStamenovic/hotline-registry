[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotline-registry"
version = "0.1.0"
description = "Contact the people who consented to be contacted"
readme = "README.md"
# 3.10 is the house floor and the CLI holds to it. The Discord cog needs py-cord,
# which needs more, but the cog is an optional extra loaded by hotlined -- the
# command-line half runs anywhere.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["discord", "sip", "registry", "consent", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.optional-dependencies]
# Only the cog needs it, and only hotlined loads the cog.
discord = ["py-cord>=2.6"]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
hotline-registry = "hotline_registry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hotline_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["discord.*"]
ignore_missing_imports = true
